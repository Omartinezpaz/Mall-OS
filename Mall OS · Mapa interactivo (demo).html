<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mall OS · Mapa interactivo (demo)</title>
    <style>
        :root {
            --bg: #F8FAFC;
            --card: #fff;
            --text: #0F172A;
            --muted: #475569;
            --line: #E2E8F0;
            --pri: #4F46E5;
            --ok: #166534;
            --no: #991B1B;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0F172A;
                --card: #1E293B;
                --text: #F1F5F9;
                --muted: #CBD5E1;
                --line: #334155;
                --pri: #818CF8;
                --ok: #86EFAC;
                --no: #FCA5A5
            }
        }

        :root[data-theme="dark"] {
            --bg: #0F172A;
            --card: #1E293B;
            --text: #F1F5F9;
            --muted: #CBD5E1;
            --line: #334155;
            --pri: #818CF8;
            --ok: #86EFAC;
            --no: #FCA5A5
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        html,
        body {
            height: 100%;
            margin: 0
        }

        body {
            background: var(--bg);
            color: var(--text);
            font: 15px/1.4 system-ui, sans-serif;
            display: flex;
            flex-direction: column
        }

        header,
        .sheet {
            background: var(--card);
            padding: 10px 14px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        header {
            border-bottom: 1px solid var(--line)
        }

        .sheet {
            border-top: 1px solid var(--line);
            flex-direction: column;
            align-items: stretch
        }

        #card {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-height: 62px
        }

        #card span {
            color: var(--muted);
            font-size: 13px
        }

        #card .ok {
            color: var(--ok)
        }

        #card .no {
            color: var(--no)
        }

        main {
            flex: 1;
            position: relative;
            min-height: 0;
            background: #F8FAFC;
            touch-action: none
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            user-select: none
        }

        button {
            font: inherit;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            border-radius: 10px;
            min-height: 44px;
            min-width: 44px;
            padding: 0 12px
        }

        button:focus-visible,
        input:focus-visible {
            outline: 3px solid var(--pri);
            outline-offset: 2px
        }

        button.on {
            background: var(--pri);
            color: #fff;
            border-color: var(--pri)
        }

        .tools {
            position: absolute;
            right: 10px;
            top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        input[type=range] {
            flex: 1;
            min-width: 140px;
            accent-color: var(--pri)
        }

        .note {
            font-size: 12px;
            color: var(--muted)
        }

        b#clock {
            min-width: 68px
        }
    </style>
</head>

<body>
    <header><b id="clock"></b><input id="time" type="range" min="5" max="23" step="0.25"
            aria-label="Hora del día"><button id="now">Ahora</button><span id="count" class="note"></span></header>
    <main><svg id="map" role="img" aria-label="Mapa interactivo del centro comercial">
            <g id="view">
                <g id="base"></g>
                <g id="route"></g>
                <g id="you"></g>
            </g>
        </svg>
        <div class="tools"><button id="zin" aria-label="Acercar">+</button><button id="zout"
                aria-label="Alejar">−</button><button id="reset" aria-label="Restablecer vista">⟲</button></div>
    </main>
    <div class="sheet">
        <div id="card"></div><button id="place">📍 Estoy aquí: tocar el mapa para marcar mi posición</button>
        <span class="note">Demo con plano y horarios ficticios. La posición se marca a mano; en la app real se fijará
            escaneando un QR o eligiendo un local.</span>
    </div>
