<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0F172A" rx="16"/>
  <!-- Pasillo Superior -->
  <rect x="50" y="250" width="700" height="100" fill="#1E293B" rx="8"/>
  <text x="400" y="305" fill="#64748B" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">PASILLO PISO 1 (ZONA DEPORTES Y HOGAR)</text>

  <!-- Fitness Club Los Teques (Ancla P1) -->
  <rect x="50" y="50" width="340" height="180" fill="#334155" stroke="#10B981" stroke-width="2" rx="8"/>
  <text x="220" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Fitness Club Los Teques (P1-01)</text>

  <!-- Mueblería Confort -->
  <rect x="410" y="50" width="340" height="180" fill="#334155" stroke="#34D399" stroke-width="2" rx="8"/>
  <text x="580" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Mueblería Confort (P1-02)</text>

  <!-- Escaleras / Acceso desde PB -->
  <rect x="250" y="370" width="300" height="180" fill="#1E293B" stroke="#64748B" stroke-dasharray="4" stroke-width="1" rx="8"/>
  <text x="400" y="465" fill="#94A3B8" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">ACCESO ESCALERAS DESDE PB</text>
</svg>
