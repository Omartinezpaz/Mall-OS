<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#0F172A" rx="16"/>
  <!-- Pasillo Central -->
  <rect x="50" y="250" width="700" height="100" fill="#1E293B" rx="8"/>
  <text x="400" y="305" fill="#64748B" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">PASILLO CENTRAL (PLANTA BAJA)</text>

  <!-- Supermercado San Diego (Ancla) -->
  <rect x="50" y="50" width="280" height="180" fill="#334155" stroke="#10B981" stroke-width="2" rx="8"/>
  <text x="190" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="14" text-anchor="middle" font-weight="bold">Supermercado San Diego (PB-01)</text>

  <!-- Panadería Los Cedros -->
  <rect x="350" y="50" width="180" height="180" fill="#334155" stroke="#34D399" stroke-width="2" rx="8"/>
  <text x="440" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Panadería Los Cedros (PB-02)</text>

  <!-- Charcutería La Estancia -->
  <rect x="550" y="50" width="200" height="180" fill="#334155" stroke="#34D399" stroke-width="2" rx="8"/>
  <text x="650" y="145" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Charcutería La Estancia (PB-03)</text>

  <!-- Farmacia SAAS -->
  <rect x="50" y="370" width="220" height="180" fill="#334155" stroke="#64748B" stroke-width="1" rx="8"/>
  <text x="160" y="465" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Farmacia SAAS (PB-04)</text>

  <!-- Banco Mercantil -->
  <rect x="290" y="370" width="220" height="180" fill="#334155" stroke="#64748B" stroke-width="1" rx="8"/>
  <text x="400" y="465" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Banco Mercantil (PB-06)</text>

  <!-- McDonald's -->
  <rect x="530" y="370" width="220" height="180" fill="#334155" stroke="#64748B" stroke-width="1" rx="8"/>
  <text x="640" y="465" fill="#F8FAFC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">McDonald's (PB-05)</text>
</svg>
